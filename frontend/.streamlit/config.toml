# Streamlit 主题：与前端自定义样式配合，保证图表、进度条、按钮同色系
# 修改后需要重启 streamlit 进程才会生效

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2430"
font = "sans serif"
chartCategoricalColors = [
  "#F59E0B",
  "#3B82F6",
  "#EC4899",
  "#8B5CF6",
  "#10B981",
  "#6366F1",
  "#9CA3AF",
]

[server]
# 上传小票图片的默认上限（MB）
maxUploadSize = 10

[browser]
gatherUsageStats = false
